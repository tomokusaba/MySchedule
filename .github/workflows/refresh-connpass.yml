name: Refresh Connpass events

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connpass-api-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check for Connpass API key
        id: api-key
        env:
          CONNPASS_API_KEY: ${{ secrets.CONNPASS_API_KEY }}
        run: |
          if [ -z "$CONNPASS_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add CONNPASS_API_KEY in repository Actions secrets to enable the daily refresh."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh event data from Connpass API v2
        if: steps.api-key.outputs.configured == 'true'
        env:
          CONNPASS_API_KEY: ${{ secrets.CONNPASS_API_KEY }}
        run: node scripts/sync-connpass.mjs

      - name: Commit refreshed event data
        if: steps.api-key.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/events.json
          if git diff --cached --quiet; then
            echo "Event data is unchanged; no commit created."
          else
            git commit -m "Refresh Connpass event data"
            git push
          fi

      - name: Deploy refreshed site
        if: steps.api-key.outputs.configured == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_DUNE_061FD6510 }}
          action: upload
          app_location: public
          api_location: ""
          output_location: ""
          skip_app_build: true
